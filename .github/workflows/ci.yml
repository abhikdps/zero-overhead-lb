name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libbpf-dev libelf-dev zlib1g-dev \
            pkg-config clang-format cppcheck

      - name: Install bpftool
        run: |
          curl -sLO https://github.com/libbpf/bpftool/releases/download/v7.7.0/bpftool-v7.7.0-amd64.tar.gz
          echo "09150596f09356b0ff632dd7f9856e0ea86bf96b269e9bc94278d9a9432a268c  bpftool-v7.7.0-amd64.tar.gz" | sha256sum -c
          sudo tar -xzf bpftool-v7.7.0-amd64.tar.gz -C /usr/local/bin bpftool
          sudo chmod +x /usr/local/bin/bpftool
          rm bpftool-v7.7.0-amd64.tar.gz

      - name: Build
        run: make BPFTOOL=/usr/local/bin/bpftool

      - name: Check formatting
        run: make fmt-check

      - name: Static analysis
        run: make check

  # Functional tests require BPF-capable kernel + root.
  # Run manually or on a self-hosted runner with:
  #   sudo scripts/setup_testbed.sh
  #   sudo nsenter --net=/var/run/netns/lb-ns build/zlb start \
  #       -i veth-lb-ns -c config/example.json &
  #   sudo pytest tests/test_lb.py -v
  #   sudo scripts/teardown_testbed.sh
